[project]
name = "retrieval-engine"
version = "0.1.0"
description = "Production RAG service: hybrid dense + BM25 retrieval, cross-encoder reranking, grounding verification, and a from-scratch evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akriti Adarsh" }]
keywords = ["rag", "retrieval", "llm", "fastapi", "pgvector", "evaluation"]
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pgvector>=0.5.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "selectolax>=0.4.11",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "structlog>=26.1.0",
    "tqdm>=4.70.0",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "ui"]
extend-exclude = ["data", "eval_results"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "I",     # isort
  "N",     # pep8-naming
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "SIM",   # flake8-simplify
  "RET",   # flake8-return
  "PTH",   # flake8-use-pathlib
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "ANN",   # flake8-annotations
  "T20",   # flake8-print
  "TID",   # flake8-tidy-imports
  "RUF",   # ruff-specific
]
ignore = [
  "ANN401", # Any is deliberate in a few protocol boundaries
  "ISC001", # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "T20", "B008"]
"scripts/**" = ["T20"]
"ui/**" = ["T20", "ANN"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers", "--strict-config", "-m", "not docker"]
markers = [
  "docker: requires live docker services (postgres/ollama); excluded from the default run",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
  "raise AssertionError",
]

[dependency-groups]
dev = [
    "hypothesis>=6.163.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12.20260724",
    "types-tqdm>=4.69.0.20260728",
]
